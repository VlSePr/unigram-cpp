name: Build Wheels

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          # Build for Python 3.8-3.12
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          # Skip 32-bit builds and musl (for simplicity)
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          # Use newer manylinux images that have cmake pre-installed
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # Install CMake in the build environment (cmake3 is already available in manylinux2014)
          CIBW_BEFORE_ALL_LINUX: |
            # manylinux2014 comes with cmake3, just ensure it's available
            which cmake3 && ln -sf $(which cmake3) /usr/local/bin/cmake || true
            # Verify cmake is available
            cmake --version || (yum install -y cmake3 && ln -sf $(which cmake3) /usr/local/bin/cmake)
          CIBW_BEFORE_ALL_MACOS: brew install cmake
          # Build from bindings/python directory
          CIBW_BUILD_FRONTEND: pip
          # Test that the wheel imports correctly
          CIBW_TEST_COMMAND: python -c "import unigram_tokeniser; print(unigram_tokeniser.__version__)"
        with:
          package-dir: bindings/python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build sdist
        run: |
          cd bindings/python
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only upload on tagged releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/unigram-tokeniser
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  upload_github_release:
    name: Upload to GitHub Releases
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Upload on tagged releases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
