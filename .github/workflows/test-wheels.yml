name: Test Wheel Installation

on:
  workflow_run:
    workflows: ["Build Wheels"]
    types: [completed]
  workflow_dispatch:

jobs:
  test_installation:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheels

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheels/*.whl

      - name: Test import
        run: |
          python -c "import unigram_tokeniser; print(f'Version: {unigram_tokeniser.__version__}')"
          python -c "from unigram_tokeniser import Tokenizer, Trainer, Vocabulary; print('✓ All imports successful')"

      - name: Run basic functionality test
        run: |
          python -c "
          import unigram_tokeniser as ut
          
          # Test Vocabulary
          vocab = ut.Vocabulary()
          print(f'✓ Created Vocabulary')
          
          # Test Config
          config = ut.TokenizerConfig()
          config.unk_token = '<unk>'
          print(f'✓ Created and configured TokenizerConfig')
          
          # Test constants
          assert ut.UNK_TOKEN == '<unk>'
          assert ut.UNK_TOKEN_ID == 0
          print(f'✓ Constants verified')
          
          print('✓ All basic tests passed!')
          "
