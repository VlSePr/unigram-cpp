[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.20", "pybind11>=2.11.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unigram-tokeniser"
version = "1.0.0"
description = "High-performance Unigram tokenizer with EM training"
readme = "README.md"
authors = [
    {name = "UnigramTokeniser Team"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=0.990",
    "build>=0.10",
]

[project.urls]
Homepage = "https://github.com/VlSePr/unigram-cpp"
Repository = "https://github.com/VlSePr/unigram-cpp"
Documentation = "https://github.com/VlSePr/unigram-cpp/blob/main/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
